# Hạ tầng cho Agentic GraphRAG: Neo4j (đồ thị tri thức) + Qdrant (vector store)
# Khởi động:  docker compose up -d
# Kiểm tra:   http://localhost:7474  (Neo4j Browser, user: neo4j / pass: fintech123)
#             http://localhost:6333/dashboard  (Qdrant)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: fintech-neo4j
    ports:
      - "7474:7474"   # HTTP - Neo4j Browser (giao diện web để chạy Cypher)
      - "7687:7687"   # Bolt - cổng driver Python kết nối vào
    environment:
      NEO4J_AUTH: neo4j/fintech123
      # APOC = thư viện tiện ích chuẩn của Neo4j, cần cho các thao tác import/merge hàng loạt
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      # Cấp bộ nhớ vừa phải - đồ thị vài chục nghìn node không cần nhiều
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: fintech-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC (client Python dùng cổng này khi bật prefer_grpc)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
